<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Switching Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .test-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        .success {
            color: green;
            font-weight: bold;
        }
        
        .error {
            color: red;
            font-weight: bold;
        }
        
        .info {
            color: blue;
            font-weight: bold;
        }
        
        #log {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>SonicGauss Model Switching Test</h1>
        <p>This test verifies that model switching works without const redeclaration errors.</p>
        
        <div class="test-section">
            <h3>Test Controls</h3>
            <button onclick="testLoadModel('data.js')">Load Model 1 (data.js)</button>
            <button onclick="testLoadModel('data_2.js')">Load Model 2 (data_2.js)</button>
            <button onclick="testLoadModel('data_3.js')">Load Model 3 (data_3.js)</button>
            <button onclick="testLoadModel('data_4.js')">Load Model 4 (data_4.js)</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>
        
        <div class="test-section">
            <h3>Test Log</h3>
            <div id="log"></div>
        </div>
        
        <div class="test-section">
            <h3>Current Status</h3>
            <p>Current Model: <span id="currentModel">None</span></p>
            <p>Model Data Available: <span id="modelDataStatus">No</span></p>
            <p>Points Data Available: <span id="pointsDataStatus">No</span></p>
            <p>Audio Data Available: <span id="audioDataStatus">No</span></p>
        </div>
    </div>

    <script>
        let currentModel = 'None';
        
        function log(message, type = 'info') {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            logElement.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        function updateStatus() {
            document.getElementById('currentModel').textContent = currentModel;
            document.getElementById('modelDataStatus').textContent = window.modelData ? 'Yes' : 'No';
            document.getElementById('pointsDataStatus').textContent = window.pointsData ? 'Yes' : 'No';
            document.getElementById('audioDataStatus').textContent = window.audioData ? 'Yes' : 'No';
        }
        
        async function testLoadModel(modelFile) {
            try {
                log(`Testing load of ${modelFile}...`, 'info');
                
                // Load the model data using the same approach as the fixed implementation
                const response = await fetch(`./static/js/webdemo/${modelFile}`);
                if (!response.ok) {
                    throw new Error(`Failed to load ${modelFile}: ${response.status}`);
                }
                
                const dataContent = await response.text();
                
                // Clear existing global variables
                window.modelData = undefined;
                window.pointsData = undefined;
                window.audioData = undefined;
                
                log('Cleared existing variables', 'info');
                
                // Execute the data file content in a way that allows reassignment
                const modifiedContent = dataContent
                    .replace(/^const modelData/m, 'window.modelData')
                    .replace(/^const pointsData/m, 'window.pointsData')
                    .replace(/^const audioData/m, 'window.audioData');
                
                log('Modified variable declarations', 'info');
                
                // Use Function constructor to execute the modified content
                const executeData = new Function(modifiedContent);
                executeData();
                
                // Verify data was loaded
                if (!window.modelData) {
                    throw new Error('Model data not loaded properly');
                }
                
                currentModel = modelFile;
                log(`Successfully loaded ${modelFile}`, 'success');
                log(`Model has texture: ${window.modelData.textureData ? 'Yes' : 'No'}`, 'info');
                log(`Model has OBJ data: ${window.modelData.objData ? 'Yes' : 'No'}`, 'info');
                log(`Points data entries: ${window.pointsData ? Object.keys(window.pointsData).length : 0}`, 'info');
                log(`Audio data entries: ${window.audioData ? Object.keys(window.audioData).length : 0}`, 'info');
                
                updateStatus();
                
            } catch (error) {
                log(`Error loading ${modelFile}: ${error.message}`, 'error');
                console.error('Model loading error:', error);
                updateStatus();
            }
        }
        
        // Initialize status display
        updateStatus();
        
        // Test auto-load of first model
        log('Initializing test environment...', 'info');
        setTimeout(() => {
            testLoadModel('data.js');
        }, 1000);
    </script>
</body>
</html>
